<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E1726" />
      <stop offset="100%" stop-color="#07090E" />
    </linearGradient>
    <linearGradient id="chip" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4" />
      <stop offset="50%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#6366F1" />
    </linearGradient>
  </defs>

  <!-- Background Base with Rounded Corners -->
  <rect width="512" height="512" rx="112" fill="url(#bg)" stroke="#232B3E" stroke-width="8" />

  <!-- Outer Neon Ring -->
  <rect x="48" y="48" width="416" height="416" rx="80" fill="none" stroke="url(#chip)" stroke-width="10" />

  <!-- Center Glowing XT Brand Monogram -->
  <g>
    <!-- X Letter -->
    <path d="M 140 160 L 190 160 L 256 250 L 322 160 L 372 160 L 286 276 L 380 400 L 330 400 L 256 302 L 182 400 L 132 400 L 226 276 Z" fill="url(#chip)" />
    <!-- T Overlay Accent -->
    <path d="M 220 160 L 380 160 L 380 200 L 320 200 L 320 400 L 280 400 L 280 200 L 220 200 Z" fill="#F8FAFC" opacity="0.95" />
  </g>

  <!-- Cyan Lightning Bolt -->
  <path d="M 270 90 L 230 190 L 275 190 L 240 290 L 310 170 L 265 170 Z" fill="#22D3EE" />
</svg>
