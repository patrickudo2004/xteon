name: 'StageLink Branch CI & Preview Build'

on:
  push:
    branches:
      - 'feat/wireless-stagelink'
  pull_request:
    branches:
      - 'main'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    name: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'windows-latest'
            target: 'x86_64-pc-windows-msvc'
            build-artifact: true
          - platform: 'macos-latest'
            target: ''
            build-artifact: false
          - platform: 'ubuntu-22.04'
            target: ''
            build-artifact: false

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Rust Stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install Linux Dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libssl-dev build-essential curl wget file libxdo-dev libasound2-dev

      - name: Install Node Dependencies
        run: npm ci

      - name: Run Automated QA Integration Tests (837+ Assertions)
        run: npm test

      - name: Verify TypeScript & Frontend Build
        run: npm run build

      - name: Run Cargo Unit Tests
        id: cargo_tests
        continue-on-error: true
        shell: bash
        run: |
          cargo test --manifest-path src-tauri/Cargo.toml --lib -- --nocapture 2>&1 | tee cargo_test.log

      - name: Print Failure to Step Summary
        if: steps.cargo_tests.outcome == 'failure'
        shell: bash
        run: |
          python3 -c "
          import re
          with open('cargo_test.log', 'r', encoding='utf-8', errors='ignore') as f:
              raw = f.read()
          ansi = re.compile(r'\x1B(?:[@-Z\\-_]|\[[0-?]*[ -/]*[@-~])')
          text = ansi.sub('', raw)
          lines = [l.strip() for l in text.splitlines() if l.strip()]
          filtered = [l for l in lines if not any(l.startswith(p) for p in ['Compiling', 'Downloaded', 'Checking', 'Finished', 'Updating', 'Blocking'])]
          for line in filtered[-30:]:
              clean = line.replace('::', '__')
              print(f'::error title=CleanDiag::{clean}')
          "
          exit 1

      - name: Upload Test Logs on Failure
        if: steps.cargo_tests.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: cargo-test-log-${{ matrix.platform }}
          path: cargo_test.log
          if-no-files-found: ignore

      - name: Build Windows Preview Installer
        if: matrix.build-artifact == true
        run: npx tauri build --target ${{ matrix.target }}
        env:
          CI: true
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Upload Windows Preview Artifacts
        if: matrix.build-artifact == true
        uses: actions/upload-artifact@v4
        with:
          name: Xteon-StageLink-Preview-Windows-x64-${{ github.sha }}
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
            src-tauri/target/${{ matrix.target }}/release/bundle/msi/*.msi
          if-no-files-found: error
